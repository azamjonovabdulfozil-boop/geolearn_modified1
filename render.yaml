# ══ RENDER BLUEPRINT — GeoLearn backend (API) ══
#
# Bu fayl repo ILDIZIDA turishi shart — Render "Blueprint" faqat shu yerdan
# o'qiydi. Frontend bu yerda yo'q: admin va user saytlari Vercel'da,
# ikkalasi ham shu bitta API'ga murojaat qiladi.
#
# Render'da: New → Blueprint → repo'ni tanlang → Apply.
# So'ng sync:false bo'lgan qiymatlarni Dashboard → Environment da to'ldirasiz.

services:
  - type: web
    name: geolearn-backend
    runtime: node
    plan: free                 # pullik rejaga o'tsangiz: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /api/site

    envVars:
      # Faqat API — statik saytlarsiz (ularni Vercel beradi)
      - key: SITE
        value: api

      # PORT ni QO'LDA QO'YMANG — Render uni o'zi beradi.

      # ── Dashboard'da to'ldiriladigan maxfiy qiymatlar ──
      # JWT_SECRET ni Render o'zi tasodifiy yaratadi (qo'lda kiritish shart emas).
      - key: JWT_SECRET
        generateValue: true

      # Admin panel paroli (login: admin). Berilsa — server har ishga tushganda
      # admin paroli shu qiymatga keltiriladi. Bo'sh qolsa parol o'zgarmaydi.
      - key: ADMIN_PASSWORD
        sync: false

      # Vercel'dagi ikkala saytning manzili, vergul bilan, / belgisiz.
      # Masalan: https://geolearn-admin.vercel.app,https://geolearn.vercel.app
      - key: FRONTEND_URL
        sync: false

      # ── MA'LUMOTLAR BAZASI (MAJBURIY — aks holda o'quvchilar o'chib ketadi) ──
      # Bepul Postgres: https://neon.tech (yoki supabase.com) da loyiha yarating,
      # "Connection string" ni shu yerga qo'ying. Masalan:
      # postgresql://user:parol@ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      # ── AI yordamchisi (ixtiyoriy — bo'sh qolsa AI o'chiq bo'ladi) ──
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: LOVABLE_API_KEY
        sync: false

    # ── DIQQAT: ma'lumotlar saqlanishi ──────────────────────────────────
    # Render'ning BEPUL rejasida disk yo'q va fayl tizimi vaqtinchalik:
    # server uxlab-uyg'onganda yoki har deploy'da backend/data/*.json
    # o'chib ketadi. Shuning uchun DATABASE_URL (bepul Neon Postgres)
    # berilsa — barcha ma'lumotlar o'sha bazada saqlanadi va server har
    # ishga tushganda bazadan tiklanadi (backend/src/lib/storage.js).
    #
    # Muqobil (pullik): starter rejaga o'tib quyidagi diskni yoqish:
    #
    # disk:
    #   name: geolearn-data
    #   mountPath: /opt/render/project/src/backend/data
    #   sizeGB: 1
